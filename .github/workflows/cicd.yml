name: CI/CD to GKE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      AR_REPO: ${{ secrets.AR_REPO }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
      CLUSTER: ${{ secrets.GKE_CLUSTER }}
      NAMESPACE: ${{ secrets.GKE_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set Semgrep mode and baseline
        id: semgrep_baseline
        shell: bash
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BASELINE="${{ github.event.before }}"
          else
            BASE_BRANCH="main"
            git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" --depth=50
            BASELINE="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          fi

          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "scan_mode=diff" >> "$GITHUB_OUTPUT"
          echo "Baseline usado: $BASELINE"

      - name: Debug archivos cambiados
        run: |
          echo "BASELINE=${{ steps.semgrep_baseline.outputs.baseline }}"
          git diff --name-only ${{ steps.semgrep_baseline.outputs.baseline }} HEAD    
          
      - name: Semgrep scan (diff-only)
        if: steps.semgrep_baseline.outputs.scan_mode == 'diff'
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        env:
          SEMGREP_APP_TOKEN: ""
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_BASELINE_COMMIT: ${{ steps.semgrep_baseline.outputs.baseline }}             

      - name: Autenticar a Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configurar Docker para autenticación a Artifact Registry
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build y push del Hola Mundo
        run: |
          set -euo pipefail
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Usando IMAGE_URI=${IMAGE_URI}"

          docker build -t "${IMAGE_URI}" ./aplication
          docker push "${IMAGE_URI}"

      - name: Instalar kubectl
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y kubectl
          fi
          kubectl version --client=true

      - name: Obtener credenciales de GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy (update a la imagen)
        run: |
          set -euo pipefail
          kubectl -n "${NAMESPACE}" set image deployment/hello hello="${IMAGE_URI}"
          kubectl -n "${NAMESPACE}" rollout status deployment/hello --timeout=180s
          kubectl -n "${NAMESPACE}" get pods -l app=hello -o wide

      - name: Escribir logs (bonus)
        run: |
          set -euo pipefail
          gcloud logging write "kambista_deploy_audit" \
            "{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"actor\":\"${{ github.actor }}\",\"cluster\":\"${CLUSTER}\",\"namespace\":\"${NAMESPACE}\",\"image\":\"${IMAGE_URI}\"}" \
            --severity=INFO
